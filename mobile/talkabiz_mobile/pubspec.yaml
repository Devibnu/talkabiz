name: talkabiz_mobile
description: Talkabiz Flutter mobile starter for auth and dashboard.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  app_links: ^6.4.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  ios: true
  image_path: assets/branding/app_icon_corporate.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
